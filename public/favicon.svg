<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A"/>
      <stop offset="40%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#78350F"/>
    </linearGradient>
    <radialGradient id="blueBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#2563EB"/>
      <stop offset="70%" stopColor="#1E3A8A"/>
      <stop offset="100%" stopColor="#0B1120"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#goldGrad)"/>
  <circle cx="50" cy="50" r="44" fill="url(#blueBg)" stroke="#FEF08A" stroke-width="2"/>
  <!-- Crown Top -->
  <polygon points="50,15 54,23 62,18 58,28 42,28 38,18 46,23" fill="#FDE047" stroke="#78350F" stroke-width="0.8"/>
  <!-- Ball 90 -->
  <circle cx="50" cy="38" r="10" fill="#EF4444" stroke="#FFF" stroke-width="1"/>
  <text x="50" y="41.5" fill="#FFF" font-size="7" font-weight="900" text-anchor="middle" font-family="sans-serif">90</text>
  <!-- Text APNA -->
  <text x="50" y="58" fill="#FDE047" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle" stroke="#78350F" stroke-width="0.8" font-family="sans-serif">APNA</text>
  <!-- Text TAMBOLA -->
  <text x="50" y="74" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle" stroke="#1E3A8A" stroke-width="1.2" font-family="sans-serif">TAMBOLA</text>
  <!-- Ribbon -->
  <path d="M22 80 C36 84, 64 84, 78 80 L76 88 C64 91, 36 91, 24 88 Z" fill="#DC2626" stroke="#FEF08A" stroke-width="0.8"/>
  <text x="50" y="86" fill="#FFF" font-size="4.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">PLAY • WIN</text>
</svg>
